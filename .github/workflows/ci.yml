name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: php -l theme/functions.php

      - name: Update-check self test
        run: php tests/update-check.php

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP Code Sniffer (WordPress-Core, errors only)
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require wp-coding-standards/wpcs:"^3" --no-progress --no-interaction -q
          ~/.composer/vendor/bin/phpcs --standard=WordPress-Core -n --extensions=php theme/functions.php

      - name: Check for leftover Nexus references
        run: |
          ! grep -ri "nexus" theme/ supplementary/ --include="*.php" --include="*.css" --include="*.js" --include="*.json" --include="*.xml"

      - name: Build theme zip
        run: ./build.sh

      - name: Zip must ship the changelog and readme
        run: |
          for f in mrdemonwolf/CHANGELOG.md mrdemonwolf/readme.txt; do
            unzip -Z1 build/mrdemonwolf.zip | grep -qx "$f" || {
              echo "Error: $f missing from the built theme zip." >&2; exit 1; }
          done

      - name: Zip must unpack to a single mrdemonwolf/ folder
        run: |
          ROOTS="$(unzip -Z1 build/mrdemonwolf.zip | cut -d/ -f1 | sort -u)"
          if [ "$ROOTS" != "mrdemonwolf" ]; then
            echo "Error: zip root is '$ROOTS', expected 'mrdemonwolf' (WordPress rejects other layouts on update)." >&2
            exit 1
          fi
