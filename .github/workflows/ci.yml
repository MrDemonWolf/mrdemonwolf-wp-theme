name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: |
          # Every PHP file that ships or runs against a site, not just the
          # theme's -- the install scripts execute via wp eval-file and a parse
          # error there fails silently halfway through a rebuild.
          find theme supplementary tools tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update-check self test
        run: php tests/update-check.php

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP Code Sniffer (WordPress-Core, errors only)
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require wp-coding-standards/wpcs:"^3" --no-progress --no-interaction -q
          ~/.composer/vendor/bin/phpcs --standard=WordPress-Core -n --extensions=php theme/functions.php

      - name: Versions must agree (style.css / readme.txt / CHANGELOG.md)
        run: |
          CSS="$(sed -n 's/^Version:[[:space:]]*//p' theme/style.css | head -1 | tr -d '\r')"
          TXT="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '\r')"
          LOG="$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          echo "style.css=$CSS  readme.txt=$TXT  CHANGELOG.md=$LOG"
          if [ "$CSS" != "$TXT" ] || [ "$CSS" != "$LOG" ]; then
            echo "Error: version mismatch across style.css, readme.txt and CHANGELOG.md." >&2
            exit 1
          fi

      - name: Branding guard
        run: ./tools/branding-guard.sh

      - name: Build theme zip
        run: ./build.sh

      - name: Zip must ship the changelog and readme
        run: |
          for f in mrdemonwolf/CHANGELOG.md mrdemonwolf/readme.txt; do
            unzip -Z1 build/mrdemonwolf.zip | grep -qx "$f" || {
              echo "Error: $f missing from the built theme zip." >&2; exit 1; }
          done

      - name: Zip must unpack to a single mrdemonwolf/ folder
        run: |
          ROOTS="$(unzip -Z1 build/mrdemonwolf.zip | cut -d/ -f1 | sort -u)"
          if [ "$ROOTS" != "mrdemonwolf" ]; then
            echo "Error: zip root is '$ROOTS', expected 'mrdemonwolf' (WordPress rejects other layouts on update)." >&2
            exit 1
          fi
